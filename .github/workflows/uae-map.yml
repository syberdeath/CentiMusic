name: UAE offline map

# Builds the HKM Launcher's offline map of the UAE from OpenStreetMap and publishes it as the
# release "uae-map" (uae.pmtiles + uae.pmtiles.sha256). Run it by hand to refresh the map.
on:
  workflow_dispatch:
  # Manual runs need this file on the default branch; until then, a change to it builds the map.
  push:
    branches: ["ccr-**"]
    paths: [.github/workflows/uae-map.yml]

permissions:
  contents: write

jobs:
  build-map:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download Planetiler
        run: curl -fsSL --retry 3 -o planetiler.jar https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar

      # Fetched here with retries (Planetiler's own downloader gives up on a slow server).
      # gcc-states is the smallest Geofabrik extract that contains the UAE.
      - name: Download sources
        run: |
          mkdir -p data/sources
          get() { curl -fL --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 30 -o "data/sources/$1" "$2"; }
          get gcc_states.osm.pbf https://download.geofabrik.de/asia/gcc-states-latest.osm.pbf
          if ! get water-polygons-split-3857.zip https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip \
             && ! get water-polygons-split-3857.zip http://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip; then
            # Last resort: an empty ocean layer. Roads, places and lakes still render; the sea shows as land.
            echo "::warning::Ocean polygons unavailable; building the map without them."
            pip install --quiet pyshp
            python3 - <<'PY'
          import os, zipfile, shapefile
          os.makedirs("water-polygons-split-3857", exist_ok=True)
          w = shapefile.Writer("water-polygons-split-3857/water_polygons", shapeType=shapefile.POLYGON)
          w.field("x", "N")
          w.close()
          open("water-polygons-split-3857/water_polygons.prj", "w").write('PROJCS["WGS 84 / Pseudo-Mercator",GEOGCS["WGS 84",DATUM["WGS_1984",SPHEROID["WGS 84",6378137,298.257223563]],PRIMEM["Greenwich",0],UNIT["degree",0.0174532925199433]],PROJECTION["Mercator_1SP"],PARAMETER["central_meridian",0],PARAMETER["scale_factor",1],PARAMETER["false_easting",0],PARAMETER["false_northing",0],UNIT["metre",1],AUTHORITY["EPSG","3857"]]')
          with zipfile.ZipFile("data/sources/water-polygons-split-3857.zip", "w") as z:
              for f in os.listdir("water-polygons-split-3857"):
                  z.write(os.path.join("water-polygons-split-3857", f))
          PY
          fi
          get natural_earth_vector.sqlite.zip https://naciscdn.org/naturalearth/packages/natural_earth_vector.sqlite.zip
          get lake_centerline.shp.zip https://github.com/acalcutt/osm-lakelines/releases/download/v12/lake_centerline.shp.zip
          ls -la data/sources

      # --bounds clips the GCC extract to the UAE.
      - name: Build uae.pmtiles
        run: |
          java -Xmx6g -jar planetiler.jar \
            --area=gcc-states \
            --osm-path=data/sources/gcc_states.osm.pbf \
            --bounds=51.4,22.5,56.5,26.3 \
            --maxzoom=14 \
            --output=uae.pmtiles
          sha256sum uae.pmtiles | cut -d' ' -f1 > uae.pmtiles.sha256
          echo "Size: $(du -h uae.pmtiles | cut -f1) ($(stat -c%s uae.pmtiles) bytes)"
          echo "SHA-256: $(cat uae.pmtiles.sha256)"

      - name: Publish release uae-map
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view uae-map >/dev/null 2>&1 || gh release create uae-map \
            --title "UAE offline map" \
            --notes "Offline map of the UAE for HKM Launcher. Built from OpenStreetMap data (© OpenStreetMap contributors, ODbL) with Planetiler." \
            --target "${{ github.sha }}"
          gh release upload uae-map uae.pmtiles uae.pmtiles.sha256 --clobber
