name: Android build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # A fixed signing key lets each new APK install as an update over the previous one.
      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.CENTIMUSIC_KEYSTORE }}
          KEY_PASSWORD: ${{ secrets.CENTIMUSIC_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets not set; building with a throwaway key to check the code."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/centimusic.jks"
          echo "CENTIMUSIC_KEYSTORE_FILE=$RUNNER_TEMP/centimusic.jks" >> "$GITHUB_ENV"
          echo "CENTIMUSIC_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon lintDebug
        continue-on-error: true

      # Uploaded as a plain .apk (not zipped) so it can be installed straight from the download.
      - name: Upload APK
        if: steps.signing.outputs.present == 'true'
        run: cp app/build/outputs/apk/debug/app-debug.apk CentiMusic.apk

      - name: Upload APK artifact
        if: steps.signing.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: CentiMusic.apk
          archive: false
          if-no-files-found: error

      # The code compiled and tests ran above; without the permanent key the APK couldn't update an
      # installed CentiMusic, so don't publish it.
      - name: Require signing key
        if: steps.signing.outputs.present != 'true' && github.event_name != 'pull_request'
        run: |
          echo "::error title=Signing key missing::Add the CENTIMUSIC_KEYSTORE and CENTIMUSIC_KEY_PASSWORD repository secrets (Settings → Secrets and variables → Actions). See README → Signing."
          exit 1

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
